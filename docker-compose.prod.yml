services:
  app:
    image: ${FEEDBACK_IMAGE}
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      FEEDBACK_SECRET_KEY: ${FEEDBACK_SECRET_KEY}
      FEEDBACK_DEBUG: "false"
      FEEDBACK_ALLOWED_HOSTS: ${FEEDBACK_ALLOWED_HOSTS}
      FEEDBACK_CSRF_TRUSTED_ORIGINS: ${FEEDBACK_CSRF_TRUSTED_ORIGINS}
      FEEDBACK_AI_API_KEY: ${FEEDBACK_AI_API_KEY}
      FEEDBACK_AI_BASE_URL: ${FEEDBACK_AI_BASE_URL}
      FEEDBACK_AI_MODEL: ${FEEDBACK_AI_MODEL}
      FEEDBACK_AI_TEMPERATURE: ${FEEDBACK_AI_TEMPERATURE}
      CANVAS_API_URL: ${CANVAS_API_URL}
      CANVAS_API_KEY: ${CANVAS_API_KEY}
      FEEDBACK_MAX_ARTIFACT_BYTES: ${FEEDBACK_MAX_ARTIFACT_BYTES:-26214400}
      FEEDBACK_MAX_PREVIEW_BYTES: ${FEEDBACK_MAX_PREVIEW_BYTES:-1048576}
      FEEDBACK_SESSION_COOKIE_SECURE: "true"
      FEEDBACK_CSRF_COOKIE_SECURE: "true"
      FEEDBACK_SECURE_SSL_REDIRECT: "false"
    volumes:
      - submissions_data:/app/submissions
      - staticfiles_data:/app/staticfiles
    ports:
      - "127.0.0.1:${FEEDBACK_BIND_PORT:-18080}:8000"

  worker:
    image: ${FEEDBACK_IMAGE}
    restart: unless-stopped
    depends_on:
      - db
    command: ["python", "manage.py", "process_batch_jobs"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      FEEDBACK_SECRET_KEY: ${FEEDBACK_SECRET_KEY}
      FEEDBACK_DEBUG: "false"
      FEEDBACK_ALLOWED_HOSTS: ${FEEDBACK_ALLOWED_HOSTS}
      FEEDBACK_CSRF_TRUSTED_ORIGINS: ${FEEDBACK_CSRF_TRUSTED_ORIGINS}
      FEEDBACK_AI_API_KEY: ${FEEDBACK_AI_API_KEY}
      FEEDBACK_AI_BASE_URL: ${FEEDBACK_AI_BASE_URL}
      FEEDBACK_AI_MODEL: ${FEEDBACK_AI_MODEL}
      FEEDBACK_AI_TEMPERATURE: ${FEEDBACK_AI_TEMPERATURE}
      CANVAS_API_URL: ${CANVAS_API_URL}
      CANVAS_API_KEY: ${CANVAS_API_KEY}
      FEEDBACK_MAX_ARTIFACT_BYTES: ${FEEDBACK_MAX_ARTIFACT_BYTES:-26214400}
      FEEDBACK_MAX_PREVIEW_BYTES: ${FEEDBACK_MAX_PREVIEW_BYTES:-1048576}
    volumes:
      - submissions_data:/app/submissions

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  submissions_data:
  staticfiles_data:
